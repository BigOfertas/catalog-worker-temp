name: Check Production Secret Availability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-production-secret.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check configured secret without exposing it
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_SECRET_AVAILABLE=yes"
          else
            echo "SUPABASE_SECRET_AVAILABLE=no"
          fi
